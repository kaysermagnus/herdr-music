id = "herdr-music"
name = "Music"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "TUI music controller — Spotify via OAuth, extensible to more providers"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "build", "--release"]

# Local playback engine. Pinned to local::ENGINE_VERSION in the code.
# rustls-tls-webpki-roots on every OS (native-tls needs OpenSSL headers on
# Linux); no discovery feature (the engine logs in with a token); rodio on
# macOS/Windows (CoreAudio/WASAPI), pipe backend on Linux (no ALSA headers).
[[build]]
platforms = ["linux"]
command = ["cargo", "install", "librespot", "--version", "0.8.0", "--locked", "--root", "./target/librespot", "--no-default-features", "--features", "rustls-tls-webpki-roots"]

[[build]]
platforms = ["macos", "windows"]
command = ["cargo", "install", "librespot", "--version", "0.8.0", "--locked", "--root", "./target/librespot", "--no-default-features", "--features", "rustls-tls-webpki-roots,rodio-backend"]

[[panes]]
id = "player"
title = "Music"
placement = "split"
command = ["./target/release/herdr-music", "tui"]

[[actions]]
id = "open"
title = "Open music player"
contexts = ["workspace"]
command = ["./target/release/herdr-music", "open"]

[[actions]]
id = "play-pause"
title = "Play / Pause"
contexts = ["workspace"]
command = ["./target/release/herdr-music", "ctl", "play-pause"]

[[actions]]
id = "stop"
title = "Stop"
contexts = ["workspace"]
command = ["./target/release/herdr-music", "ctl", "stop"]

[[actions]]
id = "next"
title = "Next track"
contexts = ["workspace"]
command = ["./target/release/herdr-music", "ctl", "next"]

[[actions]]
id = "previous"
title = "Previous track"
contexts = ["workspace"]
command = ["./target/release/herdr-music", "ctl", "previous"]

[[actions]]
id = "forward"
title = "Forward 10s"
contexts = ["workspace"]
command = ["./target/release/herdr-music", "ctl", "forward"]

[[actions]]
id = "rewind"
title = "Rewind 10s"
contexts = ["workspace"]
command = ["./target/release/herdr-music", "ctl", "rewind"]

[[actions]]
id = "spotify-login"
title = "Connect Spotify account"
contexts = ["workspace"]
command = ["./target/release/herdr-music", "auth", "login"]
