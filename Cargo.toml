[package]
name = "herdr-music"
version = "0.3.0"
edition = "2021"
description = "Herdr plugin: TUI music controller with provider adapters (Spotify first)"
license = "Apache-2.0"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
dirs = "5"
anyhow = "1"
url = "2"
# AirPlay 1 (RAOP) receiver — LGPL-3.0 (see NOTICE). Pinned exact: pre-1.0
# API; 0.10.0 was the newest release ≥7 days old at adoption.
shairplay = "=0.10.0"
# Current-thread runtime inside airplay::receiver only — shairplay needs
# it; the rest of the crate stays on std threads.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

# PCM output on Linux pipes to a player binary instead — no audio headers.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.18"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
