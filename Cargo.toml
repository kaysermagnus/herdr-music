[package]
name = "herdr-music"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin: TUI music controller with provider adapters (Spotify first)"
license = "Apache-2.0"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
dirs = "5"
anyhow = "1"
url = "2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
